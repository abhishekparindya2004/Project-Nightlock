<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NightLock Admin</title>
<link rel="icon" href="../images/nightlock-favicon-32.png">
<link rel="stylesheet" href="assets/admin.css?v=2-cms">
<script defer src="assets/admin.js?v=20261115-feedback-1"></script>
</head>
<body>
<header class="admin-header">
<a href="../index.html" class="brand"><img src="../images/nightlock-logo-inverse.svg" alt="NightLock"></a>
<span>Content studio</span>
<a href="../index.html">View website ↗</a>
<button id="signout" type="button" class="secondary" hidden>Sign out</button>
</header>
<main>
<section id="auth" class="auth-panel">
<p class="eyebrow">Project NightLock</p>
<h1>Admin sign-in</h1>
<p>Publish edits and manage the site’s media, events, profiles and submissions.</p>
<form id="login">
<label>Email <input required type="email" name="email" autocomplete="username" maxlength="254"></label>
<label>Password <input required type="password" name="password" autocomplete="current-password" maxlength="256"></label>
<button>Sign in</button>
<p role="status" id="auth-status"></p>
</form>
</section>
<section id="workspace" hidden>
<div class="studio-heading">
<div><p class="eyebrow">Project NightLock</p><h1>Website editor</h1></div>
<button id="publish" type="button">Publish changes</button>
</div>
<p id="status" role="status"></p>
<nav id="sections" aria-label="Editor sections"></nav>
<div id="editor"></div>
</section>
</main>
</body>
</html>
